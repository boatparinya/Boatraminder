<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gigi Reminds Me - ระบบแจ้งเตือนและบันทึกกิจกรรมส่วนตัว</title>
  
  <!-- Tailwind CSS v4 Play CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <!-- Google Fonts: Outfit & Mitr -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Theme Configurations for Tailwind v4 -->
  <style type="text/tailwindcss">
    @theme {
      --font-sans: 'Outfit', 'Mitr', sans-serif;
      
      /* Theme colors: Soft premium pastels */
      --color-bg-gradient-start: #f5f7fa;
      --color-bg-gradient-end: #e4e8f0;
      
      --color-study-bg: #E3F2FD;
      --color-study-text: #1E88E5;
      --color-study-border: #90CAF9;
      
      --color-faculty-bg: #F3E5F5;
      --color-faculty-text: #8E24AA;
      --color-faculty-border: #CE93D8;
      
      --color-personal-bg: #E8F5E9;
      --color-personal-text: #43A047;
      --color-personal-border: #A5D6A7;
    }
    
    body {
      font-family: var(--font-sans);
      background: linear-gradient(135deg, #eef2f7 0%, #dfe6f1 100%);
      min-height: 100vh;
    }

    /* Glassmorphism utility card styling */
    .glass-card {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
    }
    
    .glass-input {
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(200, 200, 200, 0.4);
      transition: all 0.2s ease-in-out;
    }
    
    .glass-input:focus {
      background: rgba(255, 255, 255, 0.95);
      border-color: #a3b8cc;
      box-shadow: 0 0 0 3px rgba(163, 184, 204, 0.3);
      outline: none;
    }

    /* Scrollbar customized to match theme */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.02);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(163, 184, 204, 0.4);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(163, 184, 204, 0.6);
    }
  </style>
</head>
<body class="text-slate-800 antialiased p-4 md:p-8">

  <div class="max-w-6xl mx-auto">
    
    <!-- Top Greeting Header Card -->
    <header class="glass-card rounded-3xl p-6 md:p-8 mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 transition-all duration-300">
      <div>
        <div class="flex items-center gap-2 mb-1">
          <span class="bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full text-xs font-semibold tracking-wide flex items-center gap-1">
            <i data-lucide="sparkles" class="w-3 h-3"></i> Assistant Mode Active
          </span>
        </div>
        <h1 id="gigi-greeting" class="text-2xl md:text-3xl font-bold text-slate-800 tracking-tight">
          สวัสดีค่ะเตง! กำลังดึงข้อมูลนาทีนี้... 🌸
        </h1>
        <p class="text-slate-500 text-sm mt-1 flex flex-wrap items-center gap-x-3 gap-y-1.5">
          <span class="flex items-center gap-1.5">
            <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i>
            วันนี้: <span id="live-date" class="font-medium text-slate-700">--/--/----</span>
          </span>
          <span class="hidden md:inline text-slate-300">|</span>
          <span class="flex items-center gap-1.5">
            <i data-lucide="clock" class="w-4 h-4 text-slate-400"></i>
            เวลาปัจจุบัน: <span id="live-time" class="font-medium text-slate-700">--:--:--</span>
          </span>
        </p>
      </div>
      
      <!-- Stats Container -->
      <div class="grid grid-cols-3 gap-2 w-full md:w-auto text-center">
        <div class="bg-blue-50/70 border border-blue-100/50 rounded-2xl px-4 py-3 min-w-[90px]">
          <span id="stat-today" class="block text-2xl font-bold text-blue-600">0</span>
          <span class="text-[10px] text-blue-500 font-medium uppercase tracking-wider">วันนี้</span>
        </div>
        <div class="bg-purple-50/70 border border-purple-100/50 rounded-2xl px-4 py-3 min-w-[90px]">
          <span id="stat-upcoming" class="block text-2xl font-bold text-purple-600">0</span>
          <span class="text-[10px] text-purple-500 font-medium uppercase tracking-wider">เร็วๆ นี้</span>
        </div>
        <div class="bg-green-50/70 border border-green-100/50 rounded-2xl px-4 py-3 min-w-[90px]">
          <span id="stat-completed" class="block text-2xl font-bold text-green-600">0</span>
          <span class="text-[10px] text-green-500 font-medium uppercase tracking-wider">เสร็จแล้ว</span>
        </div>
      </div>
    </header>

    <!-- Main Workspace Layout -->
    <main class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      
      <!-- Left Column: Form to Add Reminder -->
      <section class="lg:col-span-4">
        <div class="glass-card rounded-3xl p-6 sticky top-8">
          <h2 class="text-xl font-bold text-slate-800 mb-5 flex items-center gap-2">
            <span class="p-2 bg-indigo-50 text-indigo-500 rounded-xl">
              <i data-lucide="plus-circle" class="w-5 h-5"></i>
            </span>
            เพิ่มนัดหมายใหม่
          </h2>
          
          <form id="reminder-form" class="space-y-4">
            <!-- Title -->
            <div>
              <label for="reminder-title" class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">ชื่อกิจกรรม / นัดหมาย *</label>
              <input type="text" id="reminder-title" required placeholder="เช่น สอบย่อย MedChem, ประชุมเชียร์คณะ..." 
                     class="w-full px-4 py-3 rounded-2xl glass-input text-sm text-slate-800 placeholder-slate-400">
            </div>
            
            <!-- Date & Time -->
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label for="reminder-date" class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">วันที่ *</label>
                <input type="date" id="reminder-date" required 
                       class="w-full px-4 py-3 rounded-2xl glass-input text-sm text-slate-800">
              </div>
              <div>
                <label for="reminder-time" class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">เวลา *</label>
                <input type="time" id="reminder-time" required 
                       class="w-full px-4 py-3 rounded-2xl glass-input text-sm text-slate-800">
              </div>
            </div>
            
            <!-- Category -->
            <div>
              <label class="block text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wider">หมวดหมู่กิจกรรม</label>
              <div class="grid grid-cols-3 gap-2">
                <!-- Study -->
                <label class="relative flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-transparent bg-blue-50/50 hover:bg-blue-50 text-blue-700 cursor-pointer transition-all duration-200 select-none text-center">
                  <input type="radio" name="reminder-category" value="study" checked class="sr-only peer">
                  <i data-lucide="book-open" class="w-4 h-4 mb-1"></i>
                  <span class="text-xs font-medium">การเรียน</span>
                  <div class="absolute -top-1 -right-1 hidden peer-checked:flex bg-blue-600 text-white rounded-full p-0.5 border border-white">
                    <i data-lucide="check" class="w-2.5 h-2.5"></i>
                  </div>
                </label>
                
                <!-- Faculty -->
                <label class="relative flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-transparent bg-purple-50/50 hover:bg-purple-50 text-purple-700 cursor-pointer transition-all duration-200 select-none text-center">
                  <input type="radio" name="reminder-category" value="faculty" class="sr-only peer">
                  <i data-lucide="users" class="w-4 h-4 mb-1"></i>
                  <span class="text-xs font-medium">กิจกรรมคณะ</span>
                  <div class="absolute -top-1 -right-1 hidden peer-checked:flex bg-purple-600 text-white rounded-full p-0.5 border border-white">
                    <i data-lucide="check" class="w-2.5 h-2.5"></i>
                  </div>
                </label>
                
                <!-- Personal -->
                <label class="relative flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-transparent bg-green-50/50 hover:bg-green-50 text-green-700 cursor-pointer transition-all duration-200 select-none text-center">
                  <input type="radio" name="reminder-category" value="personal" class="sr-only peer">
                  <i data-lucide="user" class="w-4 h-4 mb-1"></i>
                  <span class="text-xs font-medium">ส่วนตัว</span>
                  <div class="absolute -top-1 -right-1 hidden peer-checked:flex bg-green-600 text-white rounded-full p-0.5 border border-white">
                    <i data-lucide="check" class="w-2.5 h-2.5"></i>
                  </div>
                </label>
              </div>
            </div>
            
            <!-- Notes -->
            <div>
              <label for="reminder-notes" class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">หมายเหตุเพิ่มเติม</label>
              <textarea id="reminder-notes" rows="3" placeholder="ระบุรายละเอียดเพิ่มเติม หรือสแต็กความรู้ที่ต้องเตรียม..." 
                        class="w-full px-4 py-3 rounded-2xl glass-input text-sm text-slate-800 placeholder-slate-400 resize-none"></textarea>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" 
                    class="w-full bg-gradient-to-r from-indigo-400 to-indigo-500 hover:from-indigo-500 hover:to-indigo-600 text-white font-medium py-3.5 px-4 rounded-2xl shadow-md hover:shadow-lg transition-all duration-200 transform hover:-translate-y-0.5 flex items-center justify-center gap-2 cursor-pointer">
              <i data-lucide="bell" class="w-4 h-4"></i> บันทึกเตือนความจำนะเตง
            </button>
          </form>
        </div>
      </section>

      <!-- Right Column: Dashboard and Tabs -->
      <section class="lg:col-span-8 space-y-6">
        
        <!-- Filter Tabs / Mode Selectors -->
        <div class="glass-card rounded-2xl p-2 flex gap-1">
          <button id="tab-active" class="flex-1 py-3 px-4 rounded-xl text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer bg-white text-indigo-700 shadow-sm border border-slate-100">
            <i data-lucide="list-todo" class="w-4 h-4"></i> นัดหมายปัจจุบัน
          </button>
          <button id="tab-completed" class="flex-1 py-3 px-4 rounded-xl text-sm font-semibold transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer text-slate-500 hover:text-slate-800 hover:bg-white/50">
            <i data-lucide="check-circle-2" class="w-4 h-4"></i> ประวัติที่เสร็จแล้ว
          </button>
        </div>

        <!-- Section: Active Reminders Dashboard -->
        <div id="active-dashboard" class="space-y-6">
          
          <!-- Category 1: Today -->
          <div class="space-y-3">
            <h3 class="text-sm font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-rose-400 animate-pulse"></span>
              นัดหมายวันนี้
            </h3>
            <div id="today-reminders-list" class="space-y-3">
              <!-- Rendered via JS -->
              <div class="glass-card rounded-2xl p-6 text-center text-slate-400 text-sm">
                ไม่มีนัดหมายสำหรับวันนี้ค่ะเตง พักผ่อนให้เต็มที่น้า 🛌
              </div>
            </div>
          </div>

          <!-- Category 2: Upcoming -->
          <div class="space-y-3">
            <h3 class="text-sm font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1.5">
              <span class="w-2 h-2 rounded-full bg-blue-400"></span>
              กิจกรรมที่กำลังจะถึง
            </h3>
            <div id="upcoming-reminders-list" class="space-y-3">
              <!-- Rendered via JS -->
            </div>
          </div>

        </div>

        <!-- Section: Completed Reminders Dashboard -->
        <div id="completed-dashboard" class="space-y-3 hidden">
          <h3 class="text-sm font-bold text-slate-500 uppercase tracking-widest flex items-center gap-1.5">
            <span class="w-2 h-2 rounded-full bg-green-400"></span>
            ทำเสร็จสิ้นแล้ว
          </h3>
          <div id="completed-reminders-list" class="space-y-3">
            <!-- Rendered via JS -->
          </div>
        </div>

      </section>
    </main>
  </div>

  <!-- Edit Reminder Modal -->
  <div id="edit-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4" style="background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(6px);">
    <div class="glass-card rounded-3xl p-6 w-full max-w-md shadow-2xl" style="background: rgba(255,255,255,0.95);">
      
      <!-- Modal Header -->
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
          <span class="p-2 bg-indigo-50 text-indigo-500 rounded-xl">
            <i data-lucide="pencil" class="w-5 h-5"></i>
          </span>
          แก้ไขนัดหมาย
        </h2>
        <button id="close-edit-modal" class="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-xl transition-all cursor-pointer">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="edit-form" class="space-y-4">
        <input type="hidden" id="edit-id">

        <!-- Title -->
        <div>
          <label for="edit-title" class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">ชื่อกิจกรรม / นัดหมาย *</label>
          <input type="text" id="edit-title" required
                 class="w-full px-4 py-3 rounded-2xl glass-input text-sm text-slate-800 placeholder-slate-400">
        </div>

        <!-- Date & Time -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="edit-date" class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">วันที่ *</label>
            <input type="date" id="edit-date" required
                   class="w-full px-4 py-3 rounded-2xl glass-input text-sm text-slate-800">
          </div>
          <div>
            <label for="edit-time" class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">เวลา *</label>
            <input type="time" id="edit-time" required
                   class="w-full px-4 py-3 rounded-2xl glass-input text-sm text-slate-800">
          </div>
        </div>

        <!-- Category -->
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wider">หมวดหมู่กิจกรรม</label>
          <div class="grid grid-cols-3 gap-2">
            <label class="relative flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-transparent bg-blue-50/50 hover:bg-blue-50 text-blue-700 cursor-pointer transition-all duration-200 select-none text-center">
              <input type="radio" name="edit-category" value="study" class="sr-only peer">
              <i data-lucide="book-open" class="w-4 h-4 mb-1"></i>
              <span class="text-xs font-medium">การเรียน</span>
              <div class="absolute -top-1 -right-1 hidden peer-checked:flex bg-blue-600 text-white rounded-full p-0.5 border border-white">
                <i data-lucide="check" class="w-2.5 h-2.5"></i>
              </div>
            </label>
            <label class="relative flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-transparent bg-purple-50/50 hover:bg-purple-50 text-purple-700 cursor-pointer transition-all duration-200 select-none text-center">
              <input type="radio" name="edit-category" value="faculty" class="sr-only peer">
              <i data-lucide="users" class="w-4 h-4 mb-1"></i>
              <span class="text-xs font-medium">กิจกรรมคณะ</span>
              <div class="absolute -top-1 -right-1 hidden peer-checked:flex bg-purple-600 text-white rounded-full p-0.5 border border-white">
                <i data-lucide="check" class="w-2.5 h-2.5"></i>
              </div>
            </label>
            <label class="relative flex flex-col items-center justify-center p-3 rounded-2xl border-2 border-transparent bg-green-50/50 hover:bg-green-50 text-green-700 cursor-pointer transition-all duration-200 select-none text-center">
              <input type="radio" name="edit-category" value="personal" class="sr-only peer">
              <i data-lucide="user" class="w-4 h-4 mb-1"></i>
              <span class="text-xs font-medium">ส่วนตัว</span>
              <div class="absolute -top-1 -right-1 hidden peer-checked:flex bg-green-600 text-white rounded-full p-0.5 border border-white">
                <i data-lucide="check" class="w-2.5 h-2.5"></i>
              </div>
            </label>
          </div>
        </div>

        <!-- Notes -->
        <div>
          <label for="edit-notes" class="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">หมายเหตุเพิ่มเติม</label>
          <textarea id="edit-notes" rows="3"
                    class="w-full px-4 py-3 rounded-2xl glass-input text-sm text-slate-800 placeholder-slate-400 resize-none"></textarea>
        </div>

        <!-- Buttons -->
        <div class="flex gap-3 pt-1">
          <button type="button" id="cancel-edit-btn"
                  class="flex-1 py-3 px-4 rounded-2xl border border-slate-200 text-slate-600 font-medium text-sm hover:bg-slate-50 transition-all cursor-pointer">
            ยกเลิก
          </button>
          <button type="submit"
                  class="flex-1 bg-gradient-to-r from-indigo-400 to-indigo-500 hover:from-indigo-500 hover:to-indigo-600 text-white font-medium py-3 px-4 rounded-2xl shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer">
            <i data-lucide="save" class="w-4 h-4"></i> บันทึก
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

  <!-- Link script file -->
  <script src="/app.js"></script>
</body>
</html>
